<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEME-GENICS — breed memes, delete viruses</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🐸</text></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="shake-root">

    <!-- ================= DESKTOP ================= -->
    <div id="desktop">
      <div id="wallpaper"></div>
      <div id="wallpaper-doodles"></div>

      <div id="icons"></div>

      <div id="meme-layer"></div>

      <div id="windows"></div>

      <div id="taskbar">
        <button id="start-btn" class="chunky-btn">🍔 MEME</button>
        <div id="task-buttons"></div>
        <div id="tray">
          <span id="tray-coins" class="tray-chip" title="Dogecoins">🪙 <b>0</b></span>
          <span id="tray-day" class="tray-chip" title="Day">📅 Day <b>1</b></span>
          <span id="tray-pop" class="tray-chip" title="Memes living on your desktop">🐸 <b>0</b>/12</span>
          <button id="tray-sound" class="tray-chip tray-btn" title="Toggle sound">🔊</button>
          <button id="tray-music" class="tray-chip tray-btn" title="Toggle music">🎵</button>
          <span id="tray-clock">4:20 PM</span>
        </div>
      </div>

      <div id="start-menu" class="hidden"></div>
    </div>

    <!-- ================= BATTLE ================= -->
    <div id="battle" class="hidden">
      <div id="battle-bg"></div>
      <div id="battle-header">
        <div id="battle-title">⚔️ DOWNLOADS FOLDER</div>
        <div id="turn-order"></div>
        <div id="battle-round">ROUND 1</div>
      </div>
      <div id="battle-field-wrap">
        <div id="battle-field"></div>
      </div>
      <div id="battle-bar">
        <div id="unit-card"></div>
        <div id="action-buttons"></div>
        <div id="battle-side-buttons">
          <button id="btn-bag" class="chunky-btn small">🎒 Bag</button>
          <button id="btn-endturn" class="chunky-btn small good">⏭️ End Turn</button>
          <button id="btn-flee" class="chunky-btn small bad">🏃 Flee</button>
        </div>
      </div>
      <div id="battle-log"></div>
    </div>

    <!-- ================= OVERLAYS ================= -->
    <canvas id="fx-canvas"></canvas>
    <div id="float-layer"></div>
    <div id="tooltip" class="hidden"></div>
    <div id="toasts"></div>
    <div id="modal-layer" class="hidden"></div>
    <div id="big-banner" class="hidden"></div>
  </div>

  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/data.js"></script>
  <script src="js/genetics.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/game.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
