<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEME-GENICS — breed memes, delete viruses</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 10 10' shape-rendering='crispEdges'><rect width='10' height='10' fill='%2368ac8f'/><rect x='2' y='3' width='2' height='2' fill='%2326203a'/><rect x='6' y='3' width='2' height='2' fill='%2326203a'/><rect x='3' y='6' width='4' height='1' fill='%2326203a'/></svg>">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- ================= TITLE / MENU SCREEN ================= -->
  <div id="menu-screen" class="hidden">
    <div class="menu-bg"></div>
    <div class="menu-scanline"></div>
    <div class="menu-card">
      <div class="menu-logo"><span>MEME</span><span class="mg-dash">-</span><span>GENICS</span></div>
      <div class="menu-tag">breed a bloodline · rip skill packs · delete viruses</div>
      <div class="menu-memes"></div>
      <div class="menu-actions">
        <button id="menu-play" class="chunky-btn fun big">PLAY</button>
        <button id="menu-new" class="chunky-btn small">New Game</button>
      </div>
      <div class="menu-foot">a loving parody of Mewgenics · no build step · v6.0</div>
    </div>
  </div>

 <div id="pc">
  <div id="monitor">
   <div id="screen">
    <div id="shake-root">

    <!-- ================= DESKTOP ================= -->
    <div id="desktop">
      <div id="wallpaper"></div>
      <div id="wallpaper-doodles"></div>

      <div id="icons"></div>

      <div id="meme-layer"></div>

      <div id="windows"></div>

      <div id="taskbar">
        <button id="start-btn" class="chunky-btn fun"><span id="start-ico"></span> MEME</button>
        <div id="task-buttons"></div>
        <div id="tray">
          <span id="tray-coins" class="tray-chip" title="Dogecoins"><span class="ci"></span> <b>0</b></span>
          <span id="tray-pop" class="tray-chip" title="Memes on your desktop"><span class="ci"></span> <b>0</b>/12</span>
          <button id="tray-mail" class="tray-chip tray-btn hidden" title="Adoption messages"></button>
          <button id="tray-sound" class="tray-chip tray-btn" title="Toggle sound"></button>
          <button id="tray-music" class="tray-chip tray-btn" title="Toggle music"></button>
          <span id="tray-clock">4:20 PM</span>
        </div>
      </div>

      <div id="start-menu" class="hidden"></div>
    </div>

    <!-- ================= BATTLE (cinematic arena) ================= -->
    <div id="battle" class="hidden">
      <div id="battle-bg">
        <div class="bg-layer bg-far"></div>
        <div class="bg-layer bg-mid"></div>
        <div class="bg-layer bg-near"></div>
      </div>
      <div id="cine-top" class="cine-bar"></div>
      <div id="cine-bot" class="cine-bar"></div>
      <div id="stage-camera">
        <div id="arena">
          <div id="arena-floor"></div>
          <div id="arena-props"></div>
          <div id="speedlines"></div>
          <div id="arena-units"></div>
        </div>
      </div>
      <div id="battle-top">
        <div id="battle-stagename">STAGE</div>
        <div id="battle-round">ROUND 1</div>
        <div id="battle-top-right">
          <button id="btn-bag" class="chunky-btn small">Bag</button>
          <button id="btn-flee" class="chunky-btn small bad">Flee</button>
        </div>
      </div>
      <div id="team-track"></div>
      <div id="qte-layer"></div>
      <div id="battle-log"></div>
    </div>

    </div><!-- /shake-root -->
    <div id="screen-glare"></div>
   </div><!-- /screen -->
  </div><!-- /monitor -->
 </div><!-- /pc -->

  <!-- ================= OVERLAYS (viewport-fixed) ================= -->
  <canvas id="fx-canvas"></canvas>
  <div id="float-layer"></div>
  <div id="tooltip" class="hidden"></div>
  <div id="toasts"></div>
  <div id="modal-layer" class="hidden"></div>
  <div id="big-banner" class="hidden"></div>

  <script src="js/util.js"></script>
  <script src="js/audio.js"></script>
  <script src="js/pixel.js"></script>
  <script src="js/data.js"></script>
  <script src="js/genetics.js"></script>
  <script src="js/sprites.js"></script>
  <script src="js/fx.js"></script>
  <script src="js/game.js"></script>
  <script src="js/desktop.js"></script>
  <script src="js/qte.js"></script>
  <script src="js/combat.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
